<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Le Malenator - Flash Edition</title>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <style>
        body {
            margin: 0;
            overflow: hidden;
            font-family: 'Press Start 2P', monospace;
            background-color: #000;
            user-select: none;
        }
        #ui {
            position: absolute;
            top: 15px;
            left: 15px;
            color: #00ffcc;
            font-size: 11px;
            text-shadow: 2px 2px #ff00ff;
            pointer-events: none;
            z-index: 5;
            line-height: 1.8;
        }
        #health-bar-container {
            position: absolute;
            top: 15px;
            right: 15px;
            width: 200px;
            height: 20px;
            background: rgba(0,0,0,0.8);
            border: 3px solid #ff0055;
            z-index: 5;
            pointer-events: none;
        }
        #health-bar {
            width: 100%;
            height: 100%;
            background: #00ff55;
            transition: width 0.1s linear;
        }
        #damage-flash {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(255, 0, 0, 0);
            pointer-events: none;
            transition: background 0.1s ease;
            z-index: 4;
        }
        #crosshair {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 8px;
            height: 8px;
            background-color: #ffff00;
            border: 2px solid #000;
            transform: translate(-50%, -50%);
            pointer-events: none;
            z-index: 5;
        }
        #chat-container {
            position: absolute;
            bottom: 20px;
            left: 20px;
            width: 320px;
            background: rgba(10, 10, 30, 0.85);
            border: 3px solid #00ffcc;
            border-radius: 4px;
            padding: 10px;
            display: flex;
            flex-direction: column;
            z-index: 10;
        }
        #chat-messages {
            height: 100px;
            overflow-y: auto;
            color: #fff;
            font-size: 8px;
            margin-bottom: 8px;
            display: flex;
            flex-direction: column;
            gap: 6px;
            line-height: 1.4;
        }
        #chat-messages::-webkit-scrollbar {
            width: 4px;
        }
        #chat-messages::-webkit-scrollbar-thumb {
            background: #ff00ff;
        }
        #chat-input {
            background: #000;
            border: 2px solid #00ffcc;
            color: #00ffcc;
            padding: 6px;
            font-family: 'Press Start 2P', monospace;
            font-size: 8px;
            outline: none;
        }
        #overlay-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(0, 0, 0, 0.85);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 100;
            color: #fff;
            text-align: center;
            cursor: pointer;
        }
        #overlay-screen h1 {
            color: #ff00ff;
            font-size: 32px;
            text-shadow: 4px 4px #00ffcc;
            margin-bottom: 20px;
        }
        #overlay-screen p {
            font-size: 10px;
            color: #ffff00;
            animation: blink 1s infinite;
        }
        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; }
        }
    </style>
</head>
<body>

    <div id="overlay-screen">
        <h1>LE MALENATOR</h1>
        <p>[ CLIQUEZ ICI POUR JOUER ]</p>
        <small style="margin-top: 20px; font-size: 8px; color: #aaa;">ZQSD pour bouger | T pour parler | Souris pour viser/tirer</small>
    </div>

    <div id="damage-flash"></div>
    <div id="ui">
        SCORE : <span id="score">0</span>
    </div>
    <div id="health-bar-container">
        <div id="health-bar"></div>
    </div>
    <div id="crosshair"></div>

    <div id="chat-container">
        <div id="chat-messages">
            <div><em>Système : Appuyez sur T pour parler aux gnomes...</em></div>
        </div>
        <input type="text" id="chat-input" placeholder="Parler aux gnomes..." autocomplete="off">
    </div>

    <!-- Three.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

    <script>
        // --- AUDIO SYNTHÉTISEUR RETRO (WEB AUDIO API) ---
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

        function playSound(type) {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            const now = audioCtx.currentTime;

            if (type === 'shoot') {
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(400, now);
                osc.frequency.exponentialRampToValueAtTime(40, now + 0.15);
                gain.gain.setValueAtTime(0.3, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.15);
                osc.start(now);
                osc.stop(now + 0.15);
            } else if (type === 'explode') {
                osc.type = 'square';
                osc.frequency.setValueAtTime(120, now);
                osc.frequency.exponentialRampToValueAtTime(20, now + 0.3);
                gain.gain.setValueAtTime(0.4, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.3);
                osc.start(now);
                osc.stop(now + 0.3);
            } else if (type === 'damage') {
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(150, now);
                osc.frequency.setValueAtTime(80, now + 0.1);
                gain.gain.setValueAtTime(0.4, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.2);
                osc.start(now);
                osc.stop(now + 0.2);
            }
        }

        // --- CONFIGURATION DE LA SCÈNE ---
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x0f0f1a);
        scene.fog = new THREE.FogExp2(0x0f0f1a, 0.02);

        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 1.6, 5);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        document.body.appendChild(renderer.domElement);

        // Lumières néon arcade
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.5);
        scene.add(ambientLight);

        const dirLight = new THREE.DirectionalLight(0xffffff, 0.7);
        dirLight.position.set(20, 40, 20);
        scene.add(dirLight);

        // Sol damier rétro
        const floorGeo = new THREE.PlaneGeometry(200, 200);
        const floorMat = new THREE.MeshStandardMaterial({ color: 0x1b1b2f, roughness: 0.9 });
        const floor = new THREE.Mesh(floorGeo, floorMat);
        floor.rotation.x = -Math.PI / 2;
        scene.add(floor);

        // Pistolet joueur
        const gunGroup = new THREE.Group();
        const gunBodyMat = new THREE.MeshStandardMaterial({ color: 0xff00ff, metalness: 0.8, roughness: 0.2 });
        const gunBarrel = new THREE.Mesh(new THREE.BoxGeometry(0.1, 0.1, 0.5), gunBodyMat);
        gunBarrel.position.set(0.2, -0.2, -0.5);
        const gunHandle = new THREE.Mesh(new THREE.BoxGeometry(0.08, 0.2, 0.15), new THREE.MeshStandardMaterial({ color: 0x00ffcc }));
        gunHandle.position.set(0.2, -0.32, -0.38);
        gunHandle.rotation.x = 0.3;
        gunGroup.add(gunBarrel, gunHandle);
        camera.add(gunGroup);
        scene.add(camera);

        // --- CONTRÔLES & ÉTAT ---
        let gameStarted = false;
        let moveForward = false, moveBackward = false, moveLeft = false, moveRight = false;
        let pitchObject = new THREE.Object3D();
        pitchObject.add(camera);
        let yawObject = new THREE.Object3D();
        yawObject.add(pitchObject);
        scene.add(yawObject);

        let playerHealth = 100;
        let score = 0;
        let hordeActive = false;
        let shakeTime = 0;

        const overlayScreen = document.getElementById('overlay-screen');
        const damageFlash = document.getElementById('damage-flash');
        const healthBar = document.getElementById('health-bar');
        const chatInput = document.getElementById('chat-input');
        const chatMessages = document.getElementById('chat-messages');

        overlayScreen.addEventListener('click', () => {
            overlayScreen.style.display = 'none';
            document.body.requestPointerLock();
            gameStarted = true;
        });

        document.addEventListener('pointerlockchange', () => {
            if (document.pointerLockElement !== document.body && gameStarted && document.activeElement !== chatInput) {
                overlayScreen.style.display = 'flex';
                overlayScreen.querySelector('h1').innerText = "PAUSE";
                overlayScreen.querySelector('p').innerText = "[ CLIQUEZ POUR REPRENDRE ]";
            }
        });

        document.addEventListener('mousemove', (event) => {
            if (document.pointerLockElement !== document.body) return;
            const movementX = event.movementX || event.mozMovementX || event.webkitMovementX || 0;
            const movementY = event.movementY || event.mozMovementY || event.webkitMovementY || 0;

            yawObject.rotation.y -= movementX * 0.002;
            pitchObject.rotation.x -= movementY * 0.002;
            pitchObject.rotation.x = Math.max(-Math.PI / 2, Math.min(Math.PI / 2, pitchObject.rotation.x));
        });

        document.addEventListener('keydown', (e) => {
            if (document.activeElement === chatInput) return;

            // Touche T pour ouvrir le chat
            if (e.code === 'KeyT') {
                e.preventDefault();
                chatInput.focus();
                if (document.pointerLockElement) {
                    document.exitPointerLock();
                }
                return;
            }

            if (e.code === 'KeyW' || e.code === 'KeyZ') moveForward = true;
            if (e.code === 'KeyS') moveBackward = true;
            if (e.code === 'KeyA' || e.code === 'KeyQ') moveLeft = true;
            if (e.code === 'KeyD') moveRight = true;
        });

        document.addEventListener('keyup', (e) => {
            if (e.code === 'KeyW' || e.code === 'KeyZ') moveForward = false;
            if (e.code === 'KeyS') moveBackward = false;
            if (e.code === 'KeyA' || e.code === 'KeyQ') moveLeft = false;
            if (e.code === 'KeyD') moveRight = false;
        });

        // --- CRÉATION DES MALENAS ---
        const malenas = [];

        // Générateur de texture pour l'emoji ✌️ à gauche, avec effet miroir horizontal
        function createEmojiSprite() {
            const canvas = document.createElement('canvas');
            canvas.width = 128;
            canvas.height = 128;
            const ctx = canvas.getContext('2d');
            ctx.font = '96px sans-serif';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText('✌️', 64, 64);
            
            const texture = new THREE.CanvasTexture(canvas);
            const spriteMat = new THREE.SpriteMaterial({ map: texture, transparent: true });
            const sprite = new THREE.Sprite(spriteMat);
            sprite.scale.set(-0.4, 0.4, 0.4); // X négatif pour inverser droite et gauche (miroir horizontal)
            sprite.position.set(-0.4, 0.75, 0); // Positionné à gauche du Malena
            return sprite;
        }

        function createMalena(x, z) {
            const malenaGroup = new THREE.Group();
            const bodyColor = Math.random() * 0xffffff;
            
            // Corps
            const bodyMat = new THREE.MeshStandardMaterial({ color: bodyColor });
            const body = new THREE.Mesh(new THREE.CylinderGeometry(0.2, 0.3, 0.6, 8), bodyMat);
            body.position.y = 0.3;
            malenaGroup.add(body);

            // Tête & Nez
            const headMat = new THREE.MeshStandardMaterial({ color: 0xffdbac });
            const head = new THREE.Mesh(new THREE.SphereGeometry(0.2, 8, 8), headMat);
            head.position.y = 0.75;
            malenaGroup.add(head);

            const nose = new THREE.Mesh(new THREE.SphereGeometry(0.05, 6, 6), new THREE.MeshStandardMaterial({ color: 0xff5555 }));
            nose.position.set(0, 0.75, 0.18);
            malenaGroup.add(nose);

            // Chapeau pointu
            const hatMat = new THREE.MeshStandardMaterial({ color: bodyColor });
            const hat = new THREE.Mesh(new THREE.ConeGeometry(0.22, 0.6, 8), hatMat);
            hat.position.y = 1.15;
            malenaGroup.add(hat);

            // Emoji ✌️ à gauche avec miroir horizontal
            const emojiSprite = createEmojiSprite();
            malenaGroup.add(emojiSprite);

            malenaGroup.position.set(x, 0, z);
            scene.add(malenaGroup);

            malenas.push({
                mesh: malenaGroup,
                isAlive: true,
                speed: 0.03 + Math.random() * 0.02,
                color: bodyColor
            });
        }

        for (let i = 0; i < 15; i++) {
            const angle = Math.random() * Math.PI * 2;
            const dist = 10 + Math.random() * 25;
            createMalena(Math.cos(angle) * dist, Math.sin(angle) * dist);
        }

        // --- TIR & PROJECTILES ---
        const bullets = [];
        const debrisList = [];

        window.addEventListener('mousedown', (e) => {
            if (document.pointerLockElement !== document.body || e.button !== 0) return;

            playSound('shoot');
            shakeTime = 0.1;

            gunBarrel.position.z += 0.1;
            setTimeout(() => { gunBarrel.position.z -= 0.1; }, 100);

            const muzzleFlash = new THREE.PointLight(0x00ffcc, 5, 5);
            muzzleFlash.position.set(0.2, -0.2, -0.8);
            camera.add(muzzleFlash);
            setTimeout(() => { camera.remove(muzzleFlash); }, 50);

            const bulletGeo = new THREE.SphereGeometry(0.08, 8, 8);
            const bulletMat = new THREE.MeshBasicMaterial({ color: 0x00ffcc });
            const bulletMesh = new THREE.Mesh(bulletGeo, bulletMat);

            const bulletPos = new THREE.Vector3();
            camera.getWorldPosition(bulletPos);
            bulletMesh.position.copy(bulletPos);

            const bulletDir = new THREE.Vector3();
            camera.getWorldDirection(bulletDir);
            scene.add(bulletMesh);

            bullets.push({ mesh: bulletMesh, direction: bulletDir, speed: 50.0, life: 2.0 });
        });

        function createPaintSplat(pos) {
            const splatGeo = new THREE.CircleGeometry(0.4 + Math.random() * 0.3, 12);
            const colors = [0xff0055, 0x00ffcc, 0xffff00, 0xff00ff, 0x00ff00];
            const splatMat = new THREE.MeshBasicMaterial({ 
                color: colors[Math.floor(Math.random() * colors.length)],
                transparent: true,
                opacity: 0.85
            });
            const splat = new THREE.Mesh(splatGeo, splatMat);
            splat.rotation.x = -Math.PI / 2;
            splat.position.set(pos.x, 0.01, pos.z);
            scene.add(splat);
        }

        function createExplosionDebris(pos, color) {
            playSound('explode');
            for (let i = 0; i < 8; i++) {
                const geo = new THREE.BoxGeometry(0.12, 0.12, 0.12);
                const mat = new THREE.MeshStandardMaterial({ color: Math.random() > 0.5 ? color : 0xffdbac });
                const piece = new THREE.Mesh(geo, mat);
                piece.position.set(pos.x, pos.y + 0.5, pos.z);
                scene.add(piece);

                debrisList.push({
                    mesh: piece,
                    velocity: new THREE.Vector3((Math.random() - 0.5) * 12, Math.random() * 8 + 3, (Math.random() - 0.5) * 12),
                    rotSpeed: new THREE.Vector3(Math.random() * 20, Math.random() * 20, Math.random() * 20),
                    life: 1.0
                });
            }
        }

        // --- CHAT & 50 RÉPONSES ---
        const gnomeReplies = [
            "Gni gni gna ! Tu ne m'auras pas !",
            "Les champignons sont délicieux aujourd'hui.",
            "Pourquoi tu me parles ? Tire plutôt !",
            "Zzz... Oh, un humain ! Salut !",
            "Le Malenator... quel nom ridicule !",
            "Tu penses tout savoir sur les gnomes ?",
            "Pouet pouet !",
            "J'ai perdu mon bonnet rouge, tu l'as vu ?",
            "La mousse est mon oreiller préféré.",
            "Est-ce que tu as des bonbons à la menthe ?",
            "Mon grand-père était un nain de jardin célèbre.",
            "Attention à la taupe géante !",
            "Le ciel a une couleur bizarre aujourd'hui.",
            "Tu marches sur mes plates-bandes !",
            "Bip bop, je suis un robot gnome.",
            "Les étoiles brillent pour les petits êtres.",
            "Pourquoi cours-tu partout ?",
            "Tu sens le dentifrice à la fraise.",
            "Mon chapeau est magique, il parle aux écureuils.",
            "Donne-moi ta montre, j'ai rendez-vous avec une grenouille.",
            "Coin coin ! Oh attends, je suis pas un canard.",
            "Tu veux échanger ton pistolet contre une pomme de pin ?",
            "Le vent souffle des secrets dans ma barbe.",
            "Chut, j'écoute pousser l'herbe.",
            "Les gnomes gouverneront le monde !",
            "Tu as de la poussière sur ton épaule.",
            "J'ai mangé un caillou, il était un peu dur.",
            "Viva la revolución des gnomes !",
            "Tu fais trop de bruit, ça perturbe mes taupes.",
            "C'est quoi ton excuse pour être aussi grand ?",
            "Mon rayon de soleil préféré est caché.",
            "Est-ce que tu aimes danser la gigue ?",
            "Attention derrière toi ! (Non je rigole).",
            "La gravité est une invention des grands.",
            "Je collectionne les pelures d'oignon.",
            "Tu trouves pas que le sol est vachement près de moi ?",
            "Bloubi boulba !",
            "Mon chaton s'appelle Dragon.",
            "Il pleut des cordes... ou alors c'est une araignée.",
            "Je peux retenir ma respiration pendant trois secondes.",
            "Le rouge est la couleur de la vitesse !",
            "Tu as un look de touriste interstellaire.",
            "Je prépare une potion à base de bave de limace.",
            "Tu devrais essayer de porter un bonnet pointu.",
            "Les portes dérobées mènent nulle part.",
            "Vive les souterrains humides !",
            "Tu parles beaucoup pour quelqu'un qui a une cible sur le front.",
            "Mon gâteau au cresson est le meilleur.",
            "Encore toi ? Tu n'as pas d'amis de ta taille ?",
            "Le mystère reste entier..."
        ];

        chatInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') {
                const text = chatInput.value.trim();
                if (text !== '') {
                    appendChatMessage("Vous", text);
                    
                    if (text.includes("✌️")) {
                        triggerHordeEvent();
                    } else {
                        setTimeout(() => {
                            const randomReply = gnomeReplies[Math.floor(Math.random() * gnomeReplies.length)];
                            appendChatMessage("Gnome", randomReply);
                        }, 400);
                    }

                    chatInput.value = '';
                }
                chatInput.blur();
                document.body.requestPointerLock();
            }
        });

        function appendChatMessage(sender, msg) {
            const div = document.createElement('div');
            div.innerHTML = `<strong style="color: #ff00ff;">${sender}:</strong> ${msg}`;
            chatMessages.appendChild(div);
            chatMessages.scrollTop = chatMessages.scrollHeight;
        }

        function triggerHordeEvent() {
            hordeActive = true;
            appendChatMessage("Système", "⚠️ ALERTE MAXIMALE ! Invasion massive de Malenas en cours !");
            for (let i = 0; i < 100; i++) {
                const angle = Math.random() * Math.PI * 2;
                const dist = 15 + Math.random() * 45;
                createMalena(yawObject.position.x + Math.cos(angle) * dist, yawObject.position.z + Math.sin(angle) * dist);
            }
        }

        // --- BOUCLE DE JEU ---
        const clock = new THREE.Clock();
        let spawnTimer = 0;

        function animate() {
            requestAnimationFrame(animate);

            // Vraie pause : si le jeu n'a pas commencé ou si l'écran de pause est affiché, on bloque la logique
            if (!gameStarted || overlayScreen.style.display === 'flex') {
                clock.getDelta(); // Réinitialise le delta pour éviter les sauts de temps à la reprise
                return;
            }

            const delta = clock.getDelta();

            // Secousse d'écran
            if (shakeTime > 0) {
                shakeTime -= delta;
                camera.position.x = (Math.random() - 0.5) * 0.2;
                camera.position.y = 1.6 + (Math.random() - 0.5) * 0.2;
            } else {
                camera.position.x = 0;
                camera.position.y = 1.6;
            }

            // Mouvements joueur
            const speed = 7.5 * delta;
            if (moveForward) yawObject.translateZ(-speed);
            if (moveBackward) yawObject.translateZ(speed);
            if (moveLeft) yawObject.translateX(-speed);
            if (moveRight) yawObject.translateX(speed);

            // Spawner continu
            spawnTimer += delta;
            if (spawnTimer > 1.5) {
                spawnTimer = 0;
                const angle = Math.random() * Math.PI * 2;
                const dist = 25 + Math.random() * 20;
                createMalena(yawObject.position.x + Math.cos(angle) * dist, yawObject.position.z + Math.sin(angle) * dist);
            }

            // Anti-superposition entre malenas
            for (let i = 0; i < malenas.length; i++) {
                if (!malenas[i].isAlive) continue;
                for (let j = i + 1; j < malenas.length; j++) {
                    if (!malenas[j].isAlive) continue;
                    const posA = malenas[i].mesh.position;
                    const posB = malenas[j].mesh.position;
                    const dx = posA.x - posB.x;
                    const dz = posA.z - posB.z;
                    const dist = Math.sqrt(dx * dx + dz * dz);
                    const minDist = 0.55;
                    if (dist < minDist && dist > 0) {
                        const overlap = (minDist - dist) * 0.5;
                        const nx = dx / dist;
                        const nz = dz / dist;
                        posA.x += nx * overlap; posA.z += nz * overlap;
                        posB.x -= nx * overlap; posB.z -= nz * overlap;
                    }
                }
            }

            // Gestion des balles & Collision globale
            for (let i = bullets.length - 1; i >= 0; i--) {
                let b = bullets[i];
                b.life -= delta;
                b.mesh.position.addScaledVector(b.direction, b.speed * delta);

                let hit = false;
                for (let m of malenas) {
                    if (m.isAlive) {
                        const dx = b.mesh.position.x - m.mesh.position.x;
                        const dz = b.mesh.position.z - m.mesh.position.z;
                        const horizontalDist = Math.sqrt(dx * dx + dz * dz);
                        const bulletY = b.mesh.position.y;

                        if (horizontalDist < 0.45 && bulletY >= 0 && bulletY <= 1.5) {
                            m.isAlive = false;
                            scene.remove(m.mesh);
                            score += 10;
                            document.getElementById('score').innerText = score;
                            createPaintSplat(m.mesh.position);
                            createExplosionDebris(m.mesh.position, m.color);
                            hit = true;
                            break;
                        }
                    }
                }
                if (hit || b.life <= 0) {
                    scene.remove(b.mesh);
                    bullets.splice(i, 1);
                }
            }

            // Déplacement et attaques des malenas
            malenas.forEach(m => {
                if (m.isAlive) {
                    m.mesh.lookAt(yawObject.position.x, m.mesh.position.y, yawObject.position.z);
                    const currentSpeed = hordeActive ? m.speed * 2.2 : m.speed;
                    m.mesh.translateZ(currentSpeed);

                    const dx = m.mesh.position.x - yawObject.position.x;
                    const dz = m.mesh.position.z - yawObject.position.z;
                    const distToPlayer = Math.sqrt(dx * dx + dz * dz);

                    if (distToPlayer < 1.0) {
                        playerHealth -= 20 * delta;
                        healthBar.style.width = Math.max(0, playerHealth) + '%';
                        damageFlash.style.background = 'rgba(255, 0, 0, 0.4)';
                        shakeTime = 0.15;
                        playSound('damage');

                        if (playerHealth <= 0) {
                            alert("GAME OVER! Score final : " + score);
                            location.reload();
                        }
                    } else if (playerHealth >= 100) {
                        damageFlash.style.background = 'rgba(255, 0, 0, 0)';
                    }
                }
            });

            // Débris animés
            for (let i = debrisList.length - 1; i >= 0; i--) {
                let d = debrisList[i];
                d.life -= delta;
                if (d.life <= 0) {
                    scene.remove(d.mesh);
                    debrisList.splice(i, 1);
                } else {
                    d.velocity.y -= 12 * delta;
                    d.mesh.position.addScaledVector(d.velocity, delta);
                    d.mesh.rotation.x += d.rotSpeed.x * delta;
                    d.mesh.rotation.y += d.rotSpeed.y * delta;
                    if (d.mesh.position.y < 0) {
                        d.mesh.position.y = 0;
                        d.velocity.y = 0;
                        d.velocity.multiplyScalar(0.7);
                    }
                }
            }

            renderer.render(scene, camera);
        }

        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
