<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Malenhub ✌️</title>
    <style>
        :root {
            --pink-primary: #ff69b4;
            --pink-light: #ffb6c1;
            --pink-dark: #c71585;
            --bg-color: #fff0f5;
            --card-bg: #ffffff;
            --text-color: #4a0e2e;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            overflow-x: hidden;
            position: relative;
        }

        /* Pluie d'emojis ✌️ */
        #rain-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            overflow: hidden;
            z-index: 1000;
        }

        .emoji-drop {
            position: absolute;
            top: -50px;
            font-size: 24px;
            user-select: none;
            animation: fall linear infinite;
        }

        @keyframes fall {
            0% {
                transform: translateY(-50px) rotate(0deg);
                opacity: 1;
            }
            100% {
                transform: translateY(105vh) rotate(360deg);
                opacity: 0.2;
            }
        }

        /* Header */
        header {
            text-align: center;
            padding: 40px 20px;
            z-index: 10;
        }

        header h1 {
            font-size: 3rem;
            color: var(--pink-dark);
            text-shadow: 2px 2px var(--pink-light);
            margin-bottom: 10px;
        }

        header p {
            font-size: 1.2rem;
            color: #7a315e;
        }

        /* Main */
        main {
            flex: 1;
            width: 90%;
            max-width: 1000px;
            padding: 20px;
            z-index: 10;
        }

        .games-section {
            background: var(--card-bg);
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 10px 25px rgba(255, 105, 180, 0.2);
            border: 3px solid var(--pink-light);
        }

        .games-section h2 {
            color: var(--pink-dark);
            margin-bottom: 20px;
            text-align: center;
            font-size: 1.8rem;
        }

        .games-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 20px;
        }

        /* Boutons de jeux */
        .game-btn {
            background: linear-gradient(135deg, var(--pink-primary), var(--pink-dark));
            color: white;
            border: none;
            border-radius: 15px;
            padding: 20px;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 5px 15px rgba(199, 21, 133, 0.3);
            transition: all 0.3s ease;
            text-align: center;
            text-decoration: none;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .game-btn:hover {
            transform: translateY(-5px) scale(1.03);
            box-shadow: 0 8px 20px rgba(199, 21, 133, 0.5);
            background: linear-gradient(135deg, var(--pink-dark), var(--pink-primary));
        }

        .no-games {
            grid-column: 1 / -1;
            text-align: center;
            color: #888;
            font-style: italic;
        }

        /* Footer */
        footer {
            text-align: center;
            padding: 20px;
            font-size: 0.9rem;
            color: var(--pink-dark);
            z-index: 10;
        }
    </style>
</head>
<body>
    <!-- Conteneur pour la pluie d'emojis -->
    <div id="rain-container"></div>

    <header>
        <h1>✨ Malenhub ✌️</h1>
        <p>Choisis ton jeu et amuse-toi bien !</p>
    </header>

    <main>
        <section class="games-section">
            <h2>🎮 Liste des Jeux</h2>
            <div id="games-container" class="games-grid">
                <p class="loading">Chargement des jeux...</p>
            </div>
        </section>
    </main>

    <footer>
        <p>Créé avec ❤️ pour Malenhub | Hébergé sur Vercel & GitHub</p>
    </footer>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // 1. Charger les jeux depuis le fichier généré automatiquement
            fetch('games.json')
                .then(response => {
                    if (!response.ok) {
                        throw new Error('Impossible de charger la liste des jeux.');
                    }
                    return response.json();
                })
                .then(games => {
                    const container = document.getElementById('games-container');
                    container.innerHTML = '';

                    if (games.length === 0) {
                        container.innerHTML = '<p class="no-games">Aucun jeu trouvé dans le dossier /jeux ! 😢</p>';
                        return;
                    }

                    games.forEach(game => {
                        const link = document.createElement('a');
                        link.href = `jeux/${game.filename}`;
                        link.className = 'game-btn';
                        link.innerHTML = `🎮 ${game.name}`;
                        container.appendChild(link);
                    });
                })
                .catch(error => {
                    console.error('Erreur:', error);
                    const container = document.getElementById('games-container');
                    container.innerHTML = '<p class="no-games">Erreur lors du chargement des jeux.</p>';
                });

            // 2. Créer la pluie d'emojis ✌️
            const rainContainer = document.getElementById('rain-container');
            const emojiCount = 35;

            for (let i = 0; i < emojiCount; i++) {
                createEmojiDrop();
            }

            function createEmojiDrop() {
                const drop = document.createElement('div');
                drop.className = 'emoji-drop';
                drop.innerHTML = '✌️';
                
                drop.style.left = Math.random() * 100 + 'vw';
                
                const duration = Math.random() * 4 + 3;
                drop.style.animationDuration = duration + 's';
                
                const delay = Math.random() * 5;
                drop.style.animationDelay = delay + 's';
                
                const size = Math.random() * 1.5 + 0.8;
                drop.style.fontSize = size + 'rem';

                rainContainer.appendChild(drop);

                drop.addEventListener('animationiteration', () => {
                    drop.style.left = Math.random() * 100 + 'vw';
                });
            }
        });
    </script>
</body>
</html>
